services:
  - type: web
    name: farmfusion-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm run build && npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@farmfusion.com
      - key: ADMIN_PASSWORD
        sync: false
