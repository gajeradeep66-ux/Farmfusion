<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FarmFusion — premium seeds and farming tools for modern growers." />
    <title>FarmFusion</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('farmfusion_theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
